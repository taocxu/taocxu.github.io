<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Research Note Preview | Tao Louie Lunhe Xu</title>
  <link rel="stylesheet" href="../site-v2.css">
  <link rel="stylesheet" href="../notes-preview.css">
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script>
    window.MathJax = {
      tex: {
        inlineMath: [['\\(', '\\)']],
        displayMath: [['\\[', '\\]']]
      },
      options: {
        skipHtmlTags: ['script', 'noscript', 'style', 'textarea', 'pre', 'code']
      }
    };
  </script>
  <script async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
</head>
<body class="notes-page">
  <a class="skip-link" href="#main-content">Skip to Content</a>

  <header class="site-header">
    <div class="nav-shell">
      <a class="site-name" href="../notes-preview.html#home">Tao Louie Lunhe Xu</a>
      <nav class="site-nav" aria-label="Main Navigation">
        <a href="../notes-preview.html#home">Home</a>
        <a href="../notes-preview.html#research">Research</a>
        <a href="../notes-preview.html#publications">Publications</a>
        <a href="../notes-preview.html#projects">Projects</a>
        <a href="../notes-preview.html#notes-preview-section">Notes</a>
        <a href="../notes-preview.html#grants">Grants</a>
        <a href="../notes-preview.html#cv">CV</a>
      </nav>
    </div>
  </header>

  <main id="main-content">
    <section class="content-section">
      <div class="section-heading">
        <h2 class="section-label">BLOG &amp; RESEARCH NOTES</h2>
        <article class="section-body note-article">
          <h1 id="note-title">Loading note…</h1>
          <p class="note-subtitle" id="note-subtitle" hidden></p>
          <p class="note-date" id="note-byline"></p>
          <div class="note-content" id="note-content"></div>
          <a class="note-back-link" href="index-preview.html">← Back to Blog &amp; Research Notes</a>
        </article>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="footer-shell">
      <span><a href="https://github.com/taocxu">Tao Louie</a></span>
      <span>Last Updated&nbsp;&nbsp;·&nbsp;&nbsp;July 2026</span>
    </div>
  </footer>

  <script>
    function waitForMathJax(timeoutMs) {
      const startedAt = Date.now();
      return new Promise(function (resolve, reject) {
        (function check() {
          if (window.MathJax && window.MathJax.typesetPromise) {
            resolve(window.MathJax);
            return;
          }
          if (Date.now() - startedAt >= timeoutMs) {
            reject(new Error('MathJax did not finish loading.'));
            return;
          }
          window.setTimeout(check, 50);
        })();
      });
    }

    (async function loadNote() {
      const allowed = new Set([
        'when-ideas-enter-political-economy',
        'infrastructure-power-asymmetry-global-supply-chains',
        'infrastructure-public-good-or-capitalist-power',
        'strategy-as-practice-approach',
        'entrepreneurial-ecosystems'
      ]);
      const slug = new URLSearchParams(window.location.search).get('note');
      if (!allowed.has(slug)) {
        document.getElementById('note-title').textContent = 'Preview note not found';
        return;
      }

      try {
        const response = await fetch(`../_notes/${slug}.md`, { cache: 'no-store' });
        if (!response.ok) throw new Error(`Unable to load note (${response.status})`);
        const source = await response.text();
        const match = source.match(/^---\s*\n([\s\S]*?)\n---\s*\n([\s\S]*)$/);
        if (!match) throw new Error('The note front matter is malformed.');

        const meta = {};
        for (const line of match[1].split('\n')) {
          const field = line.match(/^([A-Za-z_]+):\s*(.*)$/);
          if (field) meta[field[1]] = field[2].replace(/^['"]|['"]$/g, '');
        }

        const maths = [];
        let body = match[2];
        body = body.replace(/\\\[([\s\S]*?)\\\]/g, function (_, tex) {
          const token = `@@MATH${maths.length}@@`;
          maths.push(`<div class="math-display">\\[${tex}\\]</div>`);
          return token;
        });
        body = body.replace(/\\\((.*?)\\\)/g, function (_, tex) {
          const token = `@@MATH${maths.length}@@`;
          maths.push(`\\(${tex}\\)`);
          return token;
        });

        let rendered = marked.parse(body, { mangle: false, headerIds: false });
        maths.forEach(function (math, index) {
          rendered = rendered.replace(`@@MATH${index}@@`, math);
        });

        document.title = `${meta.title} | Tao Louie Lunhe Xu`;
        document.getElementById('note-title').textContent = meta.title || slug;
        if (meta.subtitle) {
          const subtitle = document.getElementById('note-subtitle');
          subtitle.textContent = meta.subtitle;
          subtitle.hidden = false;
        }
        const date = meta.date || '';
        const formatted = date ? new Intl.DateTimeFormat('en-GB', { day: 'numeric', month: 'long', year: 'numeric', timeZone: 'UTC' }).format(new Date(`${date}T00:00:00Z`)) : '';
        document.getElementById('note-byline').innerHTML = `<time datetime="${date}">${formatted}</time> ${meta.author || 'Tao Louie Xu'}`;
        const noteContent = document.getElementById('note-content');
        noteContent.innerHTML = rendered;

        const mathJax = await waitForMathJax(10000);
        await mathJax.typesetPromise([noteContent]);
      } catch (error) {
        document.getElementById('note-title').textContent = 'Preview could not be loaded';
        document.getElementById('note-content').textContent = error.message;
      }
    })();
  </script>
</body>
</html>
