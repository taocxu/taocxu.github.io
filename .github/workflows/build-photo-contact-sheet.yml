name: Build photo contact sheet

on:
  pull_request:
    branches:
      - gh-pages
    paths:
      - scripts/build_photo_contact_sheet.py

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out pull request branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Pillow
        run: python -m pip install --quiet pillow

      - name: Build contact sheet
        run: python scripts/build_photo_contact_sheet.py

      - name: Upload contact sheet
        uses: actions/upload-artifact@v4
        with:
          name: uploaded-photo-contact-sheet
          path: |
            photo-contact-sheet.jpg
            photo-metadata.txt
