name: Apply metadata text polish

on:
  push:
    branches:
      - feature/google-sites-v2
    paths:
      - scripts/apply_meta_text_polish.py

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/google-sites-v2
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/apply_meta_text_polish.py
      - name: Commit changes
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html site-v2.css
          git commit -m "Refine project and experience metadata typography"
          git push origin HEAD:feature/google-sites-v2
