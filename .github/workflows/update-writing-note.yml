name: Update writing note

on:
  push:
    branches:
      - gh-pages

permissions:
  contents: write

jobs:
  update-note:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gh-pages
      - name: Insert note entry
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = '<div class="notes-list notes-list-scroll" aria-label="Seven research notes; scroll to view all">'
          new = '<div class="notes-list notes-list-scroll" aria-label="Eight research notes; scroll to view all">\n            <article class="note-preview">\n              <time class="note-date" datetime="2026-08-21">21 August 2026</time>\n              <h3 class="note-preview-title"><a href="notes/writing-been-part-of-thinking/">Writing’s Been Part of Thinking</a></h3>\n            </article>'
          if old not in s:
              raise SystemExit('target not found')
          s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit update
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html
          git commit -m "Add Writing’s Been Part of Thinking to Notes" || exit 0
          git push
