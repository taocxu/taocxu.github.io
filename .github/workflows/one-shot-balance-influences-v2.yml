name: Apply balanced influences layout

on:
  push:
    branches:
      - gh-pages
    paths:
      - scripts/one_shot_balance_influences_v2.py

permissions:
  contents: write

jobs:
  apply-and-check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out published branch
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Apply balanced influences layout
        run: python scripts/one_shot_balance_influences_v2.py

      - name: Install Chromium
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium

      - name: Check responsive rendering
        shell: bash
        run: |
          python -m http.server 8000 >/tmp/site-server.log 2>&1 &
          SERVER_PID=$!
          sleep 2
          node <<'JS'
          const { chromium } = require('playwright');
          const fs = require('fs');

          (async () => {
            const browser = await chromium.launch();
            fs.mkdirSync('influence-audit', { recursive: true });
            const tests = [
              { width: 1440, height: 900, columns: 3 },
              { width: 1280, height: 900, columns: 3 },
              { width: 1180, height: 900, columns: 2 },
              { width: 900, height: 900, columns: 2 },
              { width: 390, height: 844, columns: 1 },
            ];

            for (const test of tests) {
              const page = await browser.newPage({ viewport: { width: test.width, height: test.height } });
              await page.goto('http://127.0.0.1:8000/index.html', { waitUntil: 'networkidle' });
              const overflow = await page.evaluate(() => document.documentElement.scrollWidth > document.documentElement.clientWidth);
              if (overflow) throw new Error(`Horizontal overflow at ${test.width}px`);

              const data = await page.locator('.influence-list li').evaluateAll(items => items.map(item => {
                const r = item.getBoundingClientRect();
                return { left: Math.round(r.left), right: Math.round(r.right), top: Math.round(r.top), text: item.textContent.trim() };
              }));
              const lefts = [...new Set(data.map(item => item.left))].sort((a, b) => a - b);
              if (lefts.length !== test.columns) throw new Error(`Expected ${test.columns} columns at ${test.width}px; found ${lefts.length}`);

              if (test.columns === 3) {
                const counts = lefts.map(left => data.filter(item => item.left === left).length);
                if (counts.join(',') !== '8,7,8') throw new Error(`Unexpected desktop balance at ${test.width}px: ${counts}`);
                const rows = lefts.map(left => data.filter(item => item.left === left));
                const gaps = [rows[1][0].left - rows[0][0].right, rows[2][0].left - rows[1][0].right];
                if (gaps.some(gap => gap < 28)) throw new Error(`Columns too close at ${test.width}px: ${gaps}`);
              }

              await page.locator('#influences').screenshot({ path: `influence-audit/influences-${test.width}.png` });
              await page.close();
            }
            await browser.close();
            fs.writeFileSync('influence-audit/result.txt', 'Balanced influences layout passed at all tested widths.\n');
          })().catch(error => {
            console.error(error);
            process.exit(1);
          });
          JS
          kill $SERVER_PID || true

      - name: Upload audit images
        uses: actions/upload-artifact@v4
        with:
          name: balanced-influences-layout
          path: influence-audit/*

      - name: Commit published update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Balance influences columns"
          git push origin HEAD:gh-pages
