name: Refine research layout

on:
  push:
    branches:
      - feature/google-sites-v2
    paths:
      - scripts/refine_research_layout.py

permissions:
  contents: write

jobs:
  refine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/google-sites-v2
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/refine_research_layout.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html site-v2.css
          git commit -m "Refine research interests layout and preserve PNG portrait"
          git push origin HEAD:feature/google-sites-v2
