name: Apply About text update

on:
  push:
    branches:
      - feature/google-sites-v2
    paths:
      - scripts/apply_about_text.py

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out development branch
        uses: actions/checkout@v4
        with:
          ref: feature/google-sites-v2
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Apply About text
        run: python scripts/apply_about_text.py

      - name: Commit update
        run: |
          if git diff --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Update About Tao text"
          git push origin HEAD:feature/google-sites-v2
