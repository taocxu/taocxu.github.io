name: Balance influences layout

on:
  push:
    branches:
      - gh-pages
    paths:
      - scripts/balance_influences.py

permissions:
  contents: write

jobs:
  apply-and-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Check out published branch
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Apply balanced influence layout
        run: python scripts/balance_influences.py

      - name: Install Playwright
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium

      - name: Validate responsive layout
        shell: bash
        run: |
          python -m http.server 8000 >/tmp/site-server.log 2>&1 &
          SERVER_PID=$!
          sleep 2
          node <<'JS'
          const { chromium } = require('playwright');
          const fs = require('fs');

          (async () => {
            fs.mkdirSync('influence-audit', { recursive: true });
            const browser = await chromium.launch();
            const tests = [
              { width: 1440, height: 900, columns: 3 },
              { width: 1180, height: 900, columns: 3 },
              { width: 1100, height: 900, columns: 2 },
              { width: 900, height: 900, columns: 2 },
              { width: 390, height: 844, columns: 1 },
            ];

            for (const test of tests) {
              const page = await browser.newPage({ viewport: { width: test.width, height: test.height } });
              await page.goto('http://127.0.0.1:8000/index.html', { waitUntil: 'networkidle' });

              const overflow = await page.evaluate(() => document.documentElement.scrollWidth > document.documentElement.clientWidth);
              if (overflow) throw new Error(`Horizontal overflow at ${test.width}px`);

              const boxes = await page.locator('.influence-list li').evaluateAll(items => items.map(item => {
                const rect = item.getBoundingClientRect();
                return { left: Math.round(rect.left), right: Math.round(rect.right), top: Math.round(rect.top) };
              }));
              const uniqueLefts = [...new Set(boxes.map(box => box.left))].sort((a, b) => a - b);
              if (uniqueLefts.length !== test.columns) {
                throw new Error(`Expected ${test.columns} influence columns at ${test.width}px, found ${uniqueLefts.length}`);
              }

              if (test.columns === 3) {
                const firstItems = uniqueLefts.map(left => boxes.find(box => box.left === left));
                const gaps = [firstItems[1].left - firstItems[0].right, firstItems[2].left - firstItems[1].right];
                if (gaps.some(gap => gap < 24)) throw new Error(`Influence columns are too close at ${test.width}px: ${gaps}`);
                if (Math.abs(gaps[0] - gaps[1]) > 4) throw new Error(`Influence column gaps are not visually balanced at ${test.width}px: ${gaps}`);
              }

              await page.locator('#influences').screenshot({ path: `influence-audit/influences-${test.width}.png` });
              await page.close();
            }
            await browser.close();
            fs.writeFileSync('influence-audit/result.txt', 'Responsive influence layout passed at 1440, 1180, 1100, 900, and 390 pixels.\n');
          })().catch(error => {
            console.error(error);
            process.exit(1);
          });
          JS
          kill $SERVER_PID || true

      - name: Upload audit screenshots
        uses: actions/upload-artifact@v4
        with:
          name: balanced-influences-audit
          path: influence-audit/*

      - name: Commit published update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Balance influences columns"
          git push origin HEAD:gh-pages
