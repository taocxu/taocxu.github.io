# Simple workflow for deploying static content to GitHub Pages
name: Deploy static content to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["gh-pages"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write
  actions: read

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Single deploy job since we're just deploying
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Prepare Notes pages for deployment
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          marker = '<link rel="stylesheet" href="/notes-layout-fix-20260726.css?v=2">'
          old_heading = '<h2 class="section-label">BLOG &amp; RESEARCH NOTES</h2>'
          new_heading = '<p class="section-label">BLOG &amp; RESEARCH NOTES</p>'

          for path in Path('.').rglob('*.html'):
              text = path.read_text(encoding='utf-8')

              if path.parent.parent == Path('notes'):
                  text = text.replace(old_heading, new_heading, 1)

              if 'notes.css' in text and marker not in text:
                  text = text.replace('</head>', f'  {marker}\n</head>', 1)

              path.write_text(text, encoding='utf-8')
          PY
      
      - name: Upload artifact
        id: upload
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Wait for artifact synchronisation
        run: sleep 10

      - name: Check artifact readiness
        shell: bash
        timeout-minutes: 3
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ steps.upload.outputs.artifact_id }}
        run: |
          for attempt in $(seq 1 12); do
            echo "Checking artifact: attempt ${attempt}/12"

            if gh api \
              "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts?name=github-pages" \
              | jq -e --arg id "$ARTIFACT_ID" \
              '.artifacts | length == 1 and (.[0].id | tostring) == $id and .[0].expired == false'
            then
              echo "Artifact is ready."
              exit 0
            fi

            sleep 5
          done

          echo "::error::Artifact did not become available."
          exit 1

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
