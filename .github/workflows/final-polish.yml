name: Apply final website polish

on:
  push:
    branches:
      - feature/google-sites-v2
    paths:
      - scripts/final_polish.py

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out development branch
        uses: actions/checkout@v4
        with:
          ref: feature/google-sites-v2
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Apply final polish and checks
        run: |
          python scripts/final_polish.py
          python scripts/audit_links.py
          python - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          from urllib.parse import unquote, urlparse
          import re

          source = Path('index.html').read_text(encoding='utf-8')
          ids = re.findall(r'\bid=["\']([^"\']+)["\']', source)
          duplicates = sorted({x for x in ids if ids.count(x) > 1})
          if duplicates:
              raise SystemExit(f'Duplicate ids: {duplicates}')

          class AuditParser(HTMLParser):
              def __init__(self):
                  super().__init__(convert_charrefs=True)
                  self.images = []
                  self.links = []
              def handle_starttag(self, tag, attrs):
                  attrs = dict(attrs)
                  if tag == 'img':
                      self.images.append((attrs.get('src', ''), attrs.get('alt', '')))
                  if tag in {'a', 'link', 'script'}:
                      self.links.append(attrs.get('href' if tag in {'a', 'link'} else 'src', ''))

          parser = AuditParser()
          parser.feed(source)
          if len([src for src, _ in parser.images if src.startswith('photos/')]) != 8:
              raise SystemExit('The contact gallery must contain exactly eight photographs.')
          for src, alt in parser.images:
              if not src or not alt.strip():
                  raise SystemExit(f'Image missing src or alt: {src!r}')
              if not urlparse(src).scheme and not Path(unquote(src)).exists():
                  raise SystemExit(f'Missing image: {src}')
          for value in parser.links:
              if not value or value.startswith(('#', 'mailto:', 'tel:', 'http://', 'https://')):
                  continue
              target = unquote(value.split('#', 1)[0].split('?', 1)[0])
              if target and not Path(target).exists():
                  raise SystemExit(f'Missing local target: {target}')
          if 'Law Society of England & Wales' in source:
              raise SystemExit('Unescaped ampersand remains in visible HTML.')
          print('Final structural and local-asset checks passed.')
          PY

      - name: Commit final polished state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Finalise public website copy and repository"
          git push origin HEAD:feature/google-sites-v2
