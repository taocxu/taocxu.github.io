name: Apply dissertation link update

on:
  push:
    branches:
      - feature/google-sites-v2
    paths:
      - .github/workflows/apply-dissertation-link.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out development branch
        uses: actions/checkout@v4
        with:
          ref: feature/google-sites-v2
          fetch-depth: 0

      - name: Update dissertation link
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          old = "https://mpra.ub.uni-muenchen.de/id/eprint/122669"
          new = "http://dx.doi.org/10.2139/ssrn.5085509"

          for filename in ("index.html", "LINK_INVENTORY.md"):
              path = Path(filename)
              text = path.read_text(encoding="utf-8")
              if text.count(old) != 1:
                  raise RuntimeError(f"{filename}: expected one old link, found {text.count(old)}")
              path.write_text(text.replace(old, new, 1), encoding="utf-8")

          path = Path("scripts/audit_links.py")
          text = path.read_text(encoding="utf-8")
          marker = '''        (\n            normalise_text("Edinburgh CAS, Global Politics of African Identity: Pan-Africanism & Afropolitanism"),\n            normalise_href("https://www.sps.ed.ac.uk/news-events/event/global-politics-african-identity-pan-africanism-and-challenge-afropolitanism"),\n        ),\n    }'''
          replacement = '''        (\n            normalise_text("Edinburgh CAS, Global Politics of African Identity: Pan-Africanism & Afropolitanism"),\n            normalise_href("https://www.sps.ed.ac.uk/news-events/event/global-politics-african-identity-pan-africanism-and-challenge-afropolitanism"),\n        ),\n        (\n            normalise_text("The Road Not Taken? Industrial Policy and Political Settlements in China and Indonesia 1990–2022"),\n            normalise_href("https://mpra.ub.uni-muenchen.de/id/eprint/122669"),\n        ),\n    }'''
          if text.count(marker) != 1:
              raise RuntimeError(f"audit insertion point: expected one match, found {text.count(marker)}")
          path.write_text(text.replace(marker, replacement, 1), encoding="utf-8")
          PY

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html LINK_INVENTORY.md scripts/audit_links.py
          git commit -m "Update dissertation link to SSRN"
          git push origin HEAD:feature/google-sites-v2
