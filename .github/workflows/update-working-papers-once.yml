name: Update working papers once

on:
  push:
    branches: ["update-working-papers-20260813"]

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout gh-pages
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          fetch-depth: 0

      - name: Insert two working papers
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')

          green = 'The Production and Reproduction of Green Value'
          enabling = 'Enabling Infrastructure and Agri-food Supply Chain Transformation in Global South'
          assert green not in text, 'Green Value entry already exists'
          assert enabling not in text, 'Enabling Infrastructure entry already exists'

          anchor1 = '''          <ol class="item-list no-dividers">\n            <li class="item">\n              <p class="item-title">‘Confucian Values and Supply-Chain Stability’</p>\n              <p class="item-meta">with Weiwei Zhu</p>\n            </li>'''
          replacement1 = '''          <ol class="item-list no-dividers">\n            <li class="item">\n              <p class="item-title">‘The Production and Reproduction of Green Value’</p>\n              <p class="item-meta">with Haoyu Wang</p>\n            </li>\n            <li class="item">\n              <p class="item-title">‘Confucian Values and Supply-Chain Stability’</p>\n              <p class="item-meta">with Weiwei Zhu</p>\n            </li>'''

          anchor2 = '''            <li class="item">\n              <p class="item-title">‘The Political Economy of Critical Minerals and Development: A Review’</p>\n            </li>\n            <li class="item">\n              <p class="item-title">‘Infrastructure Development and Agri-food Supply Chains in Global South: From Value Capturing to Value Sharing’</p>\n              <p class="item-meta">with Li Liu</p>\n            </li>'''
          replacement2 = '''            <li class="item">\n              <p class="item-title">‘The Political Economy of Critical Minerals and Development: A Review’</p>\n            </li>\n            <li class="item">\n              <p class="item-title">‘Enabling Infrastructure and Agri-food Supply Chain Transformation in Global South’</p>\n              <p class="item-meta">with Li Liu</p>\n            </li>\n            <li class="item">\n              <p class="item-title">‘Infrastructure Development and Agri-food Supply Chains in Global South: From Value Capturing to Value Sharing’</p>\n              <p class="item-meta">with Li Liu</p>\n            </li>'''

          assert text.count(anchor1) == 1, 'First insertion anchor mismatch'
          assert text.count(anchor2) == 1, 'Second insertion anchor mismatch'
          text = text.replace(anchor1, replacement1, 1)
          text = text.replace(anchor2, replacement2, 1)

          assert text.count(green) == 1
          assert text.count(enabling) == 1
          path.write_text(text, encoding='utf-8')
          PY

          git diff --check
          test "$(git diff --numstat -- index.html)" = $'8\t0\tindex.html'
          git diff -- index.html

      - name: Commit to gh-pages
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Add two working papers to homepage"
          git push origin HEAD:gh-pages
