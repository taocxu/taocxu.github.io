<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="{{ page.title | escape }} — a research note by Tao Louie Lunhe Xu.">
  <title>{{ page.title | escape }} | Tao Louie Lunhe Xu</title>
  <link rel="stylesheet" href="{{ '/site-v2.css' | relative_url }}">
  <link rel="stylesheet" href="{{ '/notes.css' | relative_url }}">
</head>
<body class="notes-page">
  <a class="skip-link" href="#main-content">Skip to Content</a>

  <header class="site-header">
    <div class="nav-shell">
      <a class="site-name" href="{{ '/' | relative_url }}#home">Tao Louie Lunhe Xu</a>
      <nav class="site-nav" aria-label="Main Navigation">
        <a href="{{ '/' | relative_url }}#home">Home</a>
        <a href="{{ '/' | relative_url }}#research">Research</a>
        <a href="{{ '/' | relative_url }}#publications">Publications</a>
        <a href="{{ '/' | relative_url }}#projects">Projects</a>
        <a href="{{ '/' | relative_url }}#grants">Grants</a>
        <a href="{{ '/' | relative_url }}#notes">Notes</a>
        <a href="{{ '/' | relative_url }}#cv">CV</a>
      </nav>
    </div>
  </header>

  <main id="main-content">
    <section class="content-section">
      <div class="section-heading">
        <h2 class="section-label">BLOG &amp; RESEARCH NOTES</h2>
        <article class="section-body note-article">
          <h1>{{ page.title | escape }}</h1>
          <time class="note-date" datetime="{{ page.date | date: '%Y-%m-%d' }}">{{ page.date | date: '%-d %B %Y' }}</time>
          <div class="note-content">
            {{ content }}
          </div>
          <a class="note-back-link" href="{{ '/notes/' | relative_url }}">← Back to Blog &amp; Research Notes</a>
        </article>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="footer-shell">
      <span><a href="https://github.com/taocxu">Tao Louie</a></span>
      <span>Last Updated&nbsp;&nbsp;·&nbsp;&nbsp;{{ site.time | date: '%B %Y' }}</span>
    </div>
  </footer>
</body>
</html>
